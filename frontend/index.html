<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AOneArt Ledger</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#24262B" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<link rel="icon" href="/icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css" />
</head>
<body>

<div id="login-screen" class="screen">
  <div class="login-card">
    <div class="brand">
      <div class="brand-mark"></div>
      <h1>AOneArt Ledger</h1>
    </div>
    <p class="tagline">Wall Clocks &middot; Watches &middot; Ads &middot; Expenses</p>
    <form id="login-form">
      <label>Username
        <input type="text" id="login-username" autocomplete="username" required />
      </label>
      <label>Password
        <input type="password" id="login-password" autocomplete="current-password" required />
      </label>
      <button type="submit" class="btn-primary">Log in</button>
      <p class="error" id="login-error"></p>
    </form>
  </div>
</div>

<div id="app-screen" class="screen hidden">
  <header class="topbar">
    <div class="topbar-title">
      <span class="brand-mark small"></span>
      <span id="page-title">Dashboard</span>
    </div>
    <div class="topbar-user">
      <span id="user-name"></span>
      <button id="logout-btn" class="btn-ghost">Logout</button>
    </div>
  </header>

  <main id="view-root"></main>

  <nav class="bottom-nav">
    <button class="nav-item" data-view="dashboard"><span class="dot dot-dashboard"></span>Dashboard</button>
    <button class="nav-item" data-view="wall_clocks"><span class="dot dot-wall_clocks"></span>Clocks</button>
    <button class="nav-item" data-view="watches"><span class="dot dot-watches"></span>Watches</button>
    <button class="nav-item" data-view="ads"><span class="dot dot-ads"></span>Ads</button>
    <button class="nav-item" data-view="more"><span class="dot dot-more"></span>More</button>
  </nav>
</div>

<template id="tpl-modal">
  <div class="modal-backdrop">
    <div class="modal">
      <div class="modal-head">
        <h3></h3>
        <button class="modal-close">&times;</button>
      </div>
      <div class="modal-body"></div>
    </div>
  </div>
</template>

<script src="/app.js"></script>
</body>
</html>
